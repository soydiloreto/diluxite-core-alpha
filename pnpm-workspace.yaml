packages:
  - apps/*
  - packages/*

# Dependency overrides. pnpm 10 reads these from HERE, not from
# `package.json#pnpm.overrides` (which it now silently ignores). Each pin closes
# a known advisory in a transitive / build dep:
#   - hono: @modelcontextprotocol/sdk pulls in <4.12.25 (multiple advisories).
#   - undici: pulled in at 7.26.0 (CVE-2026-12151 HIGH + 2); first patched at 7.28.0.
#   - esbuild / glob / minimatch / tar: build-tool deps kept on patched lines.
overrides:
  hono: ^4.12.25
  undici: ^7.28.0
  esbuild: ^0.28.0
  glob: ^11.1.0
  minimatch: ^10.2.3
  tar: ^7.5.11
