# Diluxite — production compose. install.sh genera este archivo en tu
# directorio de instalacion sustituyendo placeholders.
#
# Por default usa la imagen all-in-one `soydiloreto/diluxite` (api + web
# en un solo container). Para escalar api y web independientes —tipico de
# Cloud o de orgs grandes— ver el README del repo (imagenes
# `soydiloreto/diluxite-api` + `soydiloreto/diluxite-web`).
#
# Placeholders que install.sh sustituye:
#   __DILUXITE_VERSION__   → tag a pinear (ej. 1.0.0-alpha.0 o "latest")
#   __DATA_PATH__          → host path absoluto para data persistente
#   __OLLAMA_MODEL__       → opcional, ej. mxbai-embed-large:335m
#   __OLLAMA_DIMS__        → opcional, integer (ej. 1024)
#   __OLLAMA_ENDPOINT__    → opcional, ej. http://host.docker.internal:11434
#   __AZURE_ENDPOINT__     → opcional
#   __AZURE_KEY__          → opcional
#   __AZURE_DEPLOYMENT__   → opcional
#   __EXTRA_HOSTS__        → linea(s) de extra_hosts (vacio en macOS/Windows
#                            con Docker Desktop; host-gateway en Linux nativo)

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: diluxite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diluxite
      POSTGRES_PASSWORD: diluxite
      POSTGRES_DB: diluxite
    volumes:
      - __DATA_PATH__/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diluxite -d diluxite"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  diluxite:
    image: soydiloreto/diluxite:__DILUXITE_VERSION__
    container_name: diluxite
    restart: unless-stopped
    environment:
      PORT: "3030"
      DATABASE_URL: postgres://diluxite:diluxite@db:5432/diluxite
      # Auth mode chosen at install time. Local = passwordless single-user
      # (bootstrap `local@diluxite`). Server = email+password sessions; the
      # admin user is created on first boot from the two env vars below.
      DILUXITE_AUTH_MODE: "__AUTH_MODE__"
      DILUXITE_ADMIN_EMAIL: "__ADMIN_EMAIL__"
      DILUXITE_ADMIN_PASSWORD: "__ADMIN_PASSWORD__"
      # Embedder — populado por el installer. Vacio = provider deterministico
      # (sin calidad semantica, OK para probar features).
      OLLAMA_EMBEDDING_MODEL: "__OLLAMA_MODEL__"
      OLLAMA_EMBEDDING_DIMENSIONS: "__OLLAMA_DIMS__"
      OLLAMA_ENDPOINT: "__OLLAMA_ENDPOINT__"
      AZURE_OPENAI_ENDPOINT: "__AZURE_ENDPOINT__"
      AZURE_OPENAI_API_KEY: "__AZURE_KEY__"
      AZURE_OPENAI_DEPLOYMENT: "__AZURE_DEPLOYMENT__"
    ports:
      # nginx adentro del container sirve web (HTML/JS/CSS) en :5173 y
      # proxy /api + /mcp hacia 127.0.0.1:3030 (el API interno). El usuario
      # solo necesita este puerto.
      - "5173:5173"
__EXTRA_HOSTS__
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ─── Auto-update opt-in via Watchtower ─────────────────────────────────
  # Watchtower mira las imagenes locales contra Docker Hub y las reconcilia
  # cuando hay una version nueva con el mismo tag. Pinear a `X.Y.Z` (default)
  # significa que Watchtower no toca nada — para que actualice automatico,
  # cambiá los tags a `latest` o `next` Y activá este profile:
  #   docker compose --profile autoupdate up -d
  #
  # --label-enable hace que Watchtower solo toque containers con la label
  # `com.centurylinklabs.watchtower.enable=true`. Si ya tenes Watchtower
  # corriendo en el host para otras apps, no van a pisarse.
  watchtower:
    image: containrrr/watchtower
    container_name: diluxite-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "21600"  # 6 horas
      TZ: "America/Argentina/Buenos_Aires"
