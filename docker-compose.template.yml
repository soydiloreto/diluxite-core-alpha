# Diluxite — production compose. install.sh genera este archivo en tu
# directorio de instalacion sustituyendo placeholders.
#
# Por default usa la imagen all-in-one `soydiloreto/diluxite` (api + web
# en un solo container). Para escalar api y web independientes —tipico de
# Cloud o de orgs grandes— ver el README del repo (imagenes
# `soydiloreto/diluxite-api` + `soydiloreto/diluxite-web`).
#
# El installer sustituye placeholders (texto «KEY» en este header) con valores
# reales del wizard. Lista en `install.sh` cerca del comando `sed`.
#
# Servicios condicionales:
#   `caddy` con `profiles: [https]`. Levantar con `docker compose --profile https up -d`
#   cuando hay un Caddyfile al lado. El installer lo activa solo si configuras un domain.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: diluxite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: diluxite
      POSTGRES_PASSWORD: diluxite
      POSTGRES_DB: diluxite
    volumes:
      - __DATA_PATH__/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diluxite -d diluxite"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  diluxite:
    image: soydiloreto/diluxite:__DILUXITE_VERSION__
    container_name: diluxite
    restart: unless-stopped
    environment:
      PORT: "3030"
      DATABASE_URL: postgres://diluxite:diluxite@db:5432/diluxite
      # Auth mode chosen at install time. Local = passwordless single-user
      # (bootstrap `local@diluxite`). Server = email+password sessions; the
      # admin user is created on first boot from the two env vars below.
      DILUXITE_AUTH_MODE: "__AUTH_MODE__"
      DILUXITE_ADMIN_EMAIL: "__ADMIN_EMAIL__"
      DILUXITE_ADMIN_PASSWORD: "__ADMIN_PASSWORD__"
      # Collaborative editing (Yjs + Hocuspocus) sobre WebSocket. Default ON
      # — nginx interno del container proxyea /collab → :3031. Para
      # apagarlo (single-user installs, debugging, puerto 3031 ocupado),
      # descomentar la línea de abajo y hacer `docker compose restart`.
      # DILUXITE_COLLAB_DISABLED: "1"
      # Embedder — populado por el installer. Vacio = provider deterministico
      # (sin calidad semantica, OK para probar features).
      OLLAMA_EMBEDDING_MODEL: "__OLLAMA_MODEL__"
      OLLAMA_EMBEDDING_DIMENSIONS: "__OLLAMA_DIMS__"
      OLLAMA_ENDPOINT: "__OLLAMA_ENDPOINT__"
      AZURE_OPENAI_ENDPOINT: "__AZURE_ENDPOINT__"
      AZURE_OPENAI_API_KEY: "__AZURE_KEY__"
      AZURE_OPENAI_DEPLOYMENT: "__AZURE_DEPLOYMENT__"
      # Cloudflare Access (server mode) — JWT firmado verificado contra los
      # certs del team. Vacio = desactivado. NO son secretos (team + aud tag).
      DILUXITE_CF_ACCESS_TEAM_DOMAIN: "__CF_TEAM__"
      DILUXITE_CF_ACCESS_AUD: "__CF_AUD__"
    # nginx adentro del container sirve web (HTML/JS/CSS) en :5173 y proxyea
    # /api + /mcp hacia 127.0.0.1:3030 (el API interno). El instalador
    # decide si publicar al host (`ports:`) o solo exponer al network
    # interno (`expose:` cuando Caddy esta haciendo TLS terminada).
__DILUXITE_PORTS__
__EXTRA_HOSTS__
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ─── HTTPS via Caddy (opt-in, server mode) ─────────────────────────────
  # Caddy sidecar que termina TLS en :443 y proxyea al container diluxite.
  # Solo se levanta cuando el operator pasa el profile `https` —el wizard
  # del installer lo activa automaticamente si configuras un domain.
  # ACME (Let's Encrypt) corre out-of-the-box; el directorio caddy_data
  # persiste certificados y mantiene el rate-limit de LE feliz.
  caddy:
    image: caddy:2-alpine
    container_name: diluxite-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - __DATA_PATH__/caddy_data:/data
      - __DATA_PATH__/caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - diluxite
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ─── Auto-update via Watchtower ────────────────────────────────────────
  # Watchtower mira las imagenes locales contra Docker Hub y las reconcilia
  # cuando hay una version nueva con el mismo tag. El installer decide si
  # este servicio sube por default (auto-update ON, tag rolling :next/:latest)
  # o queda detras del profile `autoupdate` (auto-update OFF, tag pin).
  # Para activar manualmente: `docker compose --profile autoupdate up -d`.
  #
  # --label-enable hace que Watchtower solo toque containers con la label
  # `com.centurylinklabs.watchtower.enable=true`. Si ya tenes Watchtower
  # corriendo en el host para otras apps, no van a pisarse.
  watchtower:
    image: containrrr/watchtower
    container_name: diluxite-watchtower
    restart: unless-stopped
__WATCHTOWER_PROFILES__
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "21600"  # 6 horas
      TZ: "America/Argentina/Buenos_Aires"
