# Security headers for the pages nginx serves — shared by the `web` and
# `allinone` images, which both `include` this file.
#
# WHY HERE AND NOT ONLY IN THE API. A browser enforces a page's CSP from the
# response that delivered the DOCUMENT. The document is `index.html`, and it
# comes from nginx — so the careful CSP that Helmet puts on `/api/*` protects
# JSON that nobody executes, while the app itself was served with no policy at
# all. Anything that got a `<script>` into the page ran unopposed.
#
# WHY IT IS INCLUDED PER LOCATION, NOT ONCE AT `server`. Two reasons:
#
#   1. `add_header` does not merge across scopes. A location with its own
#      `add_header` (the asset and index.html blocks both set Cache-Control)
#      silently drops every header inherited from `server`. Repeating the
#      include is what makes them apply.
#   2. `/api/` and `/mcp` deliberately do NOT include it. Those responses
#      already carry Helmet's headers; adding a second Content-Security-Policy
#      means the browser enforces the intersection of the two, so a change on
#      either side could tighten the other by accident.
#
# `always` on every header: otherwise nginx omits them on error responses,
# which is exactly where an attacker would rather be.

# Mirrors the Helmet directives in apps/api/src/app.ts. Scripts stay strict —
# the built index.html loads one module by src and has no inline script, so
# there is nothing here to relax for. Styles keep 'unsafe-inline' because the
# Vite critical-CSS path and CodeMirror both inject style tags; tightening
# that needs a per-request nonce, which is its own change.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# The rest of what Helmet sets on the API, so the document is not the weaker
# half of the same application.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
