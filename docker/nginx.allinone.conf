# nginx config for the soydiloreto/diluxite all-in-one image.
#
# Differences from the web-only image's nginx.conf:
#   - The upstream is 127.0.0.1:3030 (the API running in the same container)
#     rather than `api:3030` (a sibling compose service).
#   - This is a full nginx.conf (not a snippet under /etc/nginx/conf.d/),
#     so we include the events block and the http wrapper.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;

    server {
        listen 5173;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Hashed asset files — long cache, never revalidate during their
        # lifetime. The hash in the filename is the cache buster.
        location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # index.html must always be fresh so users get the new bundle
        # reference after a deploy.
        location = /index.html {
            # Never cached, and now it MUST NOT be: the document carries a
            # nonce that is only valid for the response it came with.
            add_header Cache-Control "no-store";
            include /etc/nginx/security-headers.conf;
            # The other half of the nonce. `$request_id` is the same value the
            # CSP header above carries, so the style tags this app injects at
            # runtime can name it. `sub_filter_once off` because the placeholder
            # could appear more than once; `gzip off` because nginx cannot
            # substitute into a body it has already compressed.
            sub_filter '__CSP_NONCE__' '$request_id';
            sub_filter_once off;
            sub_filter_types text/html;
            gzip off;
        }

        # ─── REST API: /api/* → local API process ──────────────────────
        location /api/ {
            # El import de un vault manda el ZIP en base64 (hasta 20MB de
            # body) y el de CSV hasta ~2MB; el default de nginx (1MB) los
            # rebota con 413. 24m deja margen sobre el tope real.
            client_max_body_size 24m;
            proxy_pass http://127.0.0.1:3030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ─── MCP: /mcp/* → local API process, streaming-friendly ───────
        # MCP usa Streamable HTTP (long-lived bidirectional). Cualquier
        # buffering o re-encoding del proxy lo rompe.
        location /mcp {
            proxy_pass http://127.0.0.1:3030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Mcp-Session-Id $http_mcp_session_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            chunked_transfer_encoding on;
        }

        # ─── Collab WebSocket: /collab → Hocuspocus on :3031 ──────────
        # WebSocket upgrade needs Connection + Upgrade headers + http/1.1.
        # The read timeout has to be longer than the awareness ping cycle
        # or nginx will silently close idle conns (default 60s) and the
        # editor will see disconnect storms.
        location /collab {
            proxy_pass http://127.0.0.1:3031;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }

        # ─── SPA fallback (LAST) ──────────────────────────────────────
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
