# Diluxite web — nginx config for the production `diluxite/web` image.
#
# Three concerns, in order:
#   1. SPA fallback: any path that doesn't match a file falls back to
#      /index.html so client-side routing (React Router-style) works on
#      reload and on deep links.
#   2. /api/* reverse-proxy to the api container. The frontend uses
#      same-origin AJAX (fetch('/api/...')) so we never need CORS or a
#      build-time API URL.
#   3. /mcp/* reverse-proxy with streaming-friendly settings. MCP uses
#      Streamable HTTP, which nginx will break by default (buffering,
#      gzip, chunked re-encoding). The settings below disable those.
#
# In docker-compose, the upstream `api` resolves via the compose network's
# embedded DNS. Outside of compose (e.g. behind a proper ingress), users
# should mount a replacement /etc/nginx/conf.d/default.conf.

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults for an SPA with hashed-filename assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Long cache for hashed assets, no cache for index.html so users get
    # the new bundle reference after a deploy.
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # ─── /api reverse-proxy ───────────────────────────────────────────────
    location /api/ {
        # El import de un vault manda el ZIP en base64 (hasta 20MB de body) y
        # el de CSV hasta ~2MB; el default de nginx (1MB) los rebota con 413.
        # 24m deja margen para el overhead de base64 sobre el tope real.
        client_max_body_size 24m;
        proxy_pass http://api:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── /mcp reverse-proxy (Streamable HTTP — keep alive, no buffering) ─
    # MCP carries long-lived bidirectional traffic. Default nginx behaviour
    # buffers responses, which kills streaming.
    location /mcp {
        proxy_pass http://api:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        chunked_transfer_encoding on;
    }

    # ─── /collab → Hocuspocus WebSocket on :3031 (api sibling) ───────────
    # Requires Upgrade + Connection headers + http/1.1. Long read timeout
    # so nginx doesn't silently kill idle awareness pings.
    location /collab {
        proxy_pass http://api:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # ─── SPA fallback (LAST) ──────────────────────────────────────────────
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
