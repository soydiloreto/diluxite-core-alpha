# Supervisord config for the soydiloreto/diluxite all-in-one image.
#
# Two long-running children: the Fastify API (under user `diluxite`, no root
# privileges) and nginx (root-owned master, drops to nginx user for workers).
# If either crashes more than `startretries` times, supervisord exits with
# a non-zero code and the container restarts (because the compose
# `restart: unless-stopped` policy notices).
#
# Logs go to stdout/stderr so `docker logs` / `docker compose logs` shows
# both processes interleaved — that's how operators expect to read them.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:api]
command=node --import tsx /app/apps/api/src/index.ts
directory=/app/apps/api
user=diluxite
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3030",HOME="/home/diluxite"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
