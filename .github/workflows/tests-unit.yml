name: Unit tests

# Vitest "core" + "web" projects — no database, no external services.
# Runs the entire pure-TypeScript domain (search, chunking, tags,
# wikilinks, RRF, providers, auth) and the React component tests with
# jsdom + Testing Library.
#
# Matrix on Node version follows the same logic as typecheck.yml: prove
# the test suite passes on every supported Node version, not only the
# one the maintainer happens to run locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Node ${{ matrix.node }} — vitest unit (core + web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (vitest projects core + web)
        run: pnpm test:unit
