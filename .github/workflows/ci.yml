name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · lint · test
    runs-on: ubuntu-latest

    # Postgres + pgvector for integration tests (apps/api + packages/db).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: diluxite
          POSTGRES_PASSWORD: diluxite
          POSTGRES_DB: diluxite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diluxite -d diluxite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://diluxite:diluxite@localhost:5432/diluxite
      TEST_DATABASE_URL: postgres://diluxite:diluxite@localhost:5432/diluxite_test
      ADMIN_DATABASE_URL: postgres://diluxite:diluxite@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # Reads pnpm version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (incl. Spanish-identifier guard)
        run: pnpm lint

      - name: Test (unit)
        run: pnpm test:unit

      - name: Test (integration — db + api)
        run: pnpm test:int
