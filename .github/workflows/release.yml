name: Release — build + push to Docker Hub

# Triggered ONLY on tag push matching v*.*.* (e.g. v4.10.0). The tag-format
# guard step rejects anything else — no 'v1.10', no '1.0.0-rc1', no plain
# '1.0.0' (we require the leading 'v').
#
# Pipeline:
#   1. Validate the tag and the version-alignment of package.json files.
#   2. Build the api and web images for amd64 + arm64 via Buildx.
#   3. Push to Docker Hub as:
#        soydiloreto/diluxite-api:X.Y.Z, :X.Y, :latest
#        soydiloreto/diluxite-web:X.Y.Z, :X.Y, :latest
#   4. Cut a GitHub Release with auto-generated notes from CHANGELOG —
#      the in-app UpdateBanner reads it via the GitHub Releases API at
#      runtime (no separate latest.json on main, no protected-branch push).
#
# Secrets required (configure once in repo Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME (e.g. `soydiloreto`)
#   - DOCKERHUB_TOKEN    (Docker Hub PAT with push scope for diluxite/*)

on:
  push:
    tags:
      - 'v*.*.*'

# Single in-flight release at a time, never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write          # GitHub Release
  packages: write          # ghcr fallback if needed
  id-token: write          # Buildx OIDC, future-proofing

jobs:
  validate:
    name: Validate tag + version alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parse.outputs.version }}
      major_minor: ${{ steps.parse.outputs.major_minor }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tag format (vX.Y.Z, SemVer, leading 'v', optional prerelease)
        # First line of defence. Accepts stable (vX.Y.Z) and pre-release
        # (vX.Y.Z-alpha.N, -beta.N, -rc.N, -dev). Rejects fat-fingers
        # like v4.10 (no patch), 4.10.0 (no v), v4.0.0+build.1 (build
        # metadata not supported by the Docker tag aliases below).
        id: parse
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          echo "Tag pushed: ${tag}"
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '${tag}' does not match required format vX.Y.Z or vX.Y.Z-(alpha|beta|rc|dev)[.N]."
            echo "::error::Accepted: v4.10.0, v4.0.0-alpha.0, v4.0.0-beta.2, v4.0.0-rc.1, v4.0.0-dev."
            echo "::error::REJECTED:  4.10.0 (no v), v4.10 (no patch), v4.0.0+build.1 (build metadata)."
            exit 1
          fi
          version="${tag#v}"
          major_minor=$(echo "${version}" | cut -d. -f1-2)
          # Pre-release: stable_aliases=false means we won't tag :latest
          # or :X.Y for an alpha/beta/rc — those rolling aliases are
          # reserved for stable releases.
          if [[ "${version}" == *-* ]]; then
            is_prerelease="true"
          else
            is_prerelease="false"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "Tag format OK. version=${version} major_minor=${major_minor} prerelease=${is_prerelease}"

      - name: Verify ALL package.json files match the tag version (strict)
        run: |
          set -e
          expected="${{ steps.parse.outputs.version }}"
          root=$(node -p "require('./package.json').version")
          core=$(node -p "require('./packages/core/package.json').version")
          db=$(node -p "require('./packages/db/package.json').version")
          api=$(node -p "require('./apps/api/package.json').version")
          web=$(node -p "require('./apps/web/package.json').version")

          echo "Expected (from tag): ${expected}"
          echo "root:           ${root}"
          echo "packages/core:  ${core}"
          echo "packages/db:    ${db}"
          echo "apps/api:       ${api}"
          echo "apps/web:       ${web}"

          fail=0
          for label in "root:${root}" "core:${core}" "db:${db}" "api:${api}" "web:${web}"; do
            v="${label#*:}"
            if [ "${v}" != "${expected}" ]; then
              echo "::error::${label%:*} is at ${v}, expected ${expected}."
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::Aborting release. Use scripts/release.ts to bump the monorepo to ${expected} and re-tag."
            exit 1
          fi
          echo "All 5 package.json files aligned at ${expected}."

      - name: Verify CHANGELOG.md has an entry for this version
        # Strict at release time — the [Unreleased] escape hatch is only
        # for pre-release versions. A `vX.Y.Z` tag MUST have a literal
        # `## [X.Y.Z]` section in CHANGELOG.md.
        run: |
          set -e
          version="${{ steps.parse.outputs.version }}"
          if ! grep -qE "^##\s+\[${version}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [${version}]' section found. Add the changelog entry before tagging."
            exit 1
          fi
          echo "CHANGELOG entry for ${version} found."

  build-and-push:
    # Three Docker Hub repos in parallel:
    #   - soydiloreto/diluxite        (all-in-one — api + nginx + web in one container)
    #   - soydiloreto/diluxite-api    (api + MCP only, for users who want to scale)
    #   - soydiloreto/diluxite-web    (nginx + SPA only, idem)
    # `matrix.include` lets each entry have its own Dockerfile + Docker Hub
    # repo name + per-image README on Hub.
    name: Build + push ${{ matrix.repo }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: allinone
            dockerfile: docker/allinone.Dockerfile
            repo: soydiloreto/diluxite
          - image: api
            dockerfile: docker/api.Dockerfile
            repo: soydiloreto/diluxite-api
          - image: web
            dockerfile: docker/web.Dockerfile
            repo: soydiloreto/diluxite-web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        # Stable release  → :X.Y.Z, :X.Y, :latest. Self-hosters who want
        #                   stability pin to :X.Y.Z; those tracking
        #                   patches pin to :X.Y; the brave use :latest.
        # Pre-release    → :X.Y.Z (exact) + :next (rolling alias for
        #                   anyone who wants the freshest alpha/beta/rc).
        #                   Pre-releases DO NOT take :latest — that
        #                   would foot-gun anyone tracking the stable
        #                   channel.
        id: tags
        run: |
          v="${{ needs.validate.outputs.version }}"
          mm="${{ needs.validate.outputs.major_minor }}"
          pre="${{ needs.validate.outputs.is_prerelease }}"
          repo="${{ matrix.repo }}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${repo}:${v}" >> "$GITHUB_OUTPUT"
          if [ "${pre}" = "true" ]; then
            echo "${repo}:next" >> "$GITHUB_OUTPUT"
          else
            echo "${repo}:${mm}" >> "$GITHUB_OUTPUT"
            echo "${repo}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build + push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GHA cache speeds repeated builds dramatically.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          labels: |
            org.opencontainers.image.title=${{ matrix.repo }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Docker Hub READMEs are published by .github/workflows/update-hub-readmes.yml,
      # which runs on any push to docker/hub-readme-*.md (or via manual dispatch).
      # That decoupling lets us fix a README typo without retagging a release.

  smoke:
    # Post-build verification against the freshly-published image. This is
    # the gate that would have caught the alpha.11 collab regression: pulls
    # the all-in-one image we just pushed, levanta el stack, conecta como
    # cliente WebSocket real, verifica que el sync inicial completa con el
    # contenido seeded. Si falla, el workflow falla — el operator ve el
    # rojo y sabe que `:next` quedó apuntando a una imagen rota antes de
    # que algún usuario con Watchtower la pullee.
    name: Post-release smoke (real WS client vs Docker Hub image)
    needs: [validate, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (need @hocuspocus/provider + yjs + ws)
        run: pnpm install --frozen-lockfile

      - name: Run smoke vs published image
        working-directory: apps/api
        # Script lives in apps/api/scripts/ so its ESM bare imports
        # (@hocuspocus/provider + yjs + ws) resolve naturally against the
        # apps/api node_modules tree.
        run: node scripts/post-release-smoke.mjs ${{ needs.validate.outputs.version }}

  finalize:
    name: GitHub Release
    needs: [validate, build-and-push, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release with notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          body: |
            ## Docker Hub images (linux/amd64 + linux/arm64)

            **All-in-one (recommended for self-host)**
            - `soydiloreto/diluxite:${{ needs.validate.outputs.version }}` — api + web in one container

            **Separated (for scaling / Cloud)**
            - `soydiloreto/diluxite-api:${{ needs.validate.outputs.version }}`
            - `soydiloreto/diluxite-web:${{ needs.validate.outputs.version }}`

            See [`CHANGELOG.md`](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full notes.
