name: Typecheck

# Run `tsc --noEmit` across the four tsconfigs in the monorepo
# (packages/core, packages/db, apps/api, apps/web) on multiple Node
# versions. Equivalent to the PHP-version syntax matrix in
# wpm-user-sync's pr-checks.yml: prove the code typechecks not only on
# the maintainer's Node version, but on every version we declare in
# `engines: ">=20"` of the root package.json.
#
# If a contributor introduces a TS feature that only works on Node 24+,
# this matrix catches it before it lands on main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Node ${{ matrix.node }} — tsc --noEmit (4 projects)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20: minimum supported (engines field).
        # 22: current LTS.
        # 24: latest stable. Matches docker/api.Dockerfile and
        #     docker/web.Dockerfile base image (node:24-alpine).
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all four projects (core, db, api, web)
        run: pnpm typecheck
