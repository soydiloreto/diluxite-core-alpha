# Diluxite — full stack en Docker. `docker compose up` y arranca todo.
#
# Servicios (puerto del host por default; ver "Varios proyectos" abajo):
#   db      Postgres 17 + pgvector       :5432  (healthcheck antes que api)
#   api     Fastify + MCP (puerto 3030)  :3030  (corre migraciones al boot)
#   web     Vite dev server (UI)         :5173
#   adminer Admin de Postgres            :8080  (opcional; profile `tools`)
#
# Varios proyectos en la misma máquina:
#   Cada puerto publicado sale de una variable con default, así que se cambia
#   en el `.env` de ESTE directorio y no tocando este archivo:
#
#     DILUXITE_DB_PORT=5433
#     DILUXITE_API_PORT=3040
#     DILUXITE_WEB_PORT=5183
#
#   Adentro del compose los servicios se hablan por la red interna (`db:5432`,
#   `api:3030`), así que mover un puerto del host no rompe nada entre ellos —
#   sólo cambia por dónde entrás vos. Si movés DILUXITE_DB_PORT, acordate de
#   `DATABASE_URL` en el `.env` (`pnpm dev` y los tests entran por el host).
#
# Uso típico en Mac:
#   docker compose up --build
#   # Web → http://localhost:5173
#   # API → http://localhost:3030
#   # DB admin (opcional) → docker compose --profile tools up adminer

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: diluxite-db
    environment:
      POSTGRES_USER: diluxite
      POSTGRES_PASSWORD: diluxite
      POSTGRES_DB: diluxite
    ports:
      # Solo localhost: la DB de dev usa creds triviales (diluxite/diluxite),
      # no la expongas a la LAN/WSL. pnpm dev y los tests entran por acá.
      - "127.0.0.1:${DILUXITE_DB_PORT:-5432}:5432"
    volumes:
      - diluxite_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diluxite -d diluxite"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: diluxite-api
    environment:
      PORT: "3030"
      COLLAB_PORT: "3031"
      DATABASE_URL: postgres://diluxite:diluxite@db:5432/diluxite
    ports:
      # El collab (WebSocket) va siempre pegado al API: +1.
      - "${DILUXITE_API_PORT:-3030}:3030"
      - "${DILUXITE_COLLAB_PORT:-3031}:3031"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: diluxite-web
    environment:
      # Inside the compose network the API is reachable at host `api`, not localhost.
      API_TARGET: http://api:3030
    ports:
      - "${DILUXITE_WEB_PORT:-5173}:5173"
    depends_on:
      - api

  adminer:
    image: adminer:5
    container_name: diluxite-adminer
    profiles: ["tools"]
    ports:
      - "${DILUXITE_ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    depends_on:
      - db

volumes:
  diluxite_pgdata:
